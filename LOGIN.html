<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NOOR MODS</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
      background: #141414;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 20px #00f0ff, 0 0 30px #ff00ff, 0 0 40px #00ff00;
      text-align: center;
      width: 340px;
    }

    .login-box h2 {
      color: #00ffff;
      font-size: 28px;
      margin-bottom: 30px;
      text-shadow: 0 0 10px #00ffff;
    }

    .input-box {
      margin-bottom: 20px;
      position: relative;
    }

    .input-box input {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      background: transparent;
      color: #fff;
      box-shadow: inset 0 0 10px #ff00ff, 0 0 10px #00f0ff;
      outline: none;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      border: none;
      font-size: 18px;
      border-radius: 10px;
      background: linear-gradient(90deg, #ff00ff, #00ffff, #00ff00);
      color: white;
      cursor: pointer;
      transition: transform 0.2s;
      text-shadow: 0 0 10px #000;
    }

    .login-btn:hover {
      transform: scale(1.05);
    }

    .error {
      color: #ff4d4d;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>LOGIN</h2>
    <div class="input-box">
      <input type="text" id="username" placeholder="Username">
    </div>
    <div class="input-box">
      <input type="password" id="password" placeholder="Password">
    </div>
    <button class="login-btn" onclick="checkLogin()">LOGIN</button>
    <div class="error" id="error-msg"></div>
  </div>

  <script>
    function checkLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('error-msg');

      if (username === 'NOOR' && password === '9999') {
        alert('Login Successful!');
        errorMsg.textContent = '';
        // Redirect or next action can go here
      } else {
        errorMsg.textContent = 'Invalid username or password.';
      }
    }
  </script>

</body>
</html>
